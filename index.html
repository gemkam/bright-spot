<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bright Spot — Multan's Online Marketplace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 8h16l-1.5 11a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7L4 8Z' fill='%23F97316'/%3E%3Cpath d='M8 8V6a4 4 0 0 1 8 0v2' stroke='%23F97316' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<meta property="og:title" content="Bright Spot — Multan's Online Marketplace">
<meta property="og:description" content="Home & kitchen, beauty, electronics, and fashion — delivered across Multan. Cash on Delivery, no account needed.">
<meta property="og:image" content="https://images.pexels.com/photos/3683198/pexels-photo-3683198.jpeg?auto=compress&cs=tinysrgb&w=1200">
<meta property="og:url" content="https://bright-spot.vercel.app/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Jost:wght@300;400;500;600&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ffffff;
    --panel:#f6f4fb;
    --panel-2:#ece8f9;
    --line: rgba(109,40,217,0.18);
    --ivory:#1a1625;
    --ivory-dim:#6b6478;
    --neon:#F97316;
    --neon-bright:#FB923C;
    --cat-home:#2E7D32;
    --cat-beauty:#B45309;
    --cat-electronics:#1D4ED8;
    --cat-fashion:#C2410C;
    --hero-dark:#0b0714;
    --radius: 3px;
  }

  /* Theme Switcher Root Variables */
  [data-theme="dark"] {
    --ink: #0b0714;
    --panel: #130e22;
    --panel-2: #1b1430;
    --line: rgba(249, 115, 22, 0.22);
    --ivory: #f5f2fb;
    --ivory-dim: #9d96ab;
  }
  [data-theme="light"] {
    --ink: #ffffff;
    --panel: #f6f4fb;
    --panel-2: #ece8f9;
    --line: rgba(109, 40, 217, 0.18);
    --ivory: #1a1625;
    --ivory-dim: #6b6478;
    --hero-dark: #161026;
  }

  .theme-toggle {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 10px;
    background: #0a0a0a; border: 1.5px solid #F97316; color: #F97316; cursor: pointer;
    box-shadow: 0 0 8px rgba(249,115,22,0.6), 0 0 16px rgba(249,115,22,0.35), inset 0 0 6px rgba(249,115,22,0.15);
    transition: box-shadow .2s ease, color .2s ease, transform .15s ease, border-color .2s ease;
  }
  .theme-toggle:hover {
    color: #FB923C; border-color: #FB923C;
    box-shadow: 0 0 12px rgba(251,146,60,0.9), 0 0 28px rgba(251,146,60,0.55), 0 0 44px rgba(251,146,60,0.25);
    transform: scale(1.04);
  }
  .theme-toggle svg { width: 17px; height: 17px; }
  [data-theme="dark"] .theme-icon-light { display: block; }
  [data-theme="dark"] .theme-icon-dark { display: none; }
  [data-theme="light"] .theme-icon-light { display: none; }
  [data-theme="light"] .theme-icon-dark { display: block; }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--ink); color:var(--ivory); font-family:'Jost', sans-serif; font-weight:300; overflow-x:hidden; transition: background-color 0.3s ease, color 0.3s ease; }
  h1,h2,h3,.display{ font-family:'Sora', sans-serif; font-weight:700; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  img,svg{ display:block; max-width:100%; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
  ::selection{ background:var(--neon); color:var(--ink); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; animation-iteration-count:1 !important; transition-duration:0.1s !important; }
  }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:1px solid var(--neon-bright); outline-offset:3px;
  }

  /* ================= NAV ================= */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:linear-gradient(to bottom, rgba(11,7,20,0.92), rgba(11,7,20,0));
    padding:20px 0; transition:background .4s ease, padding .4s ease;
  }
  header.scrolled{ background:rgba(11,7,20,0.92); backdrop-filter:blur(8px); padding:13px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; max-width:100%; padding:0 28px; gap:16px; }
  .brandmark{ display:flex; align-items:center; gap:10px; font-family:'Sora', sans-serif; font-weight:700; font-size:1.3rem; letter-spacing:-0.01em; color:var(--ivory); white-space:nowrap; flex-shrink:0; }
  header .brandmark{ color:#f5f2fb; }

  .brandmark-sparkle{ position:relative; }
  .shine-text{
    position:relative; display:inline-block;
    color:#ffffff;
    animation:glowPulse 2.6s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%, 100%{ text-shadow:0 0 6px rgba(255,214,0,0.35), 0 0 1px rgba(255,255,255,0.6); }
    50%{ text-shadow:0 0 16px rgba(255,214,0,0.85), 0 0 30px rgba(249,115,22,0.5), 0 0 2px rgba(255,255,255,0.9); }
  }
  .sparkle{
    position:absolute; width:10px; height:10px; pointer-events:none;
    animation:sparkleTwinkle 2.4s ease-in-out infinite;
  }
  .sparkle-1{ top:-6px; right:-4px; animation-delay:0s; }
  .sparkle-2{ bottom:-4px; right:22%; width:7px; height:7px; animation-delay:1.1s; }
  @keyframes sparkleTwinkle{
    0%, 100%{ opacity:0; transform:scale(0.3) rotate(0deg); }
    50%{ opacity:1; transform:scale(1) rotate(25deg); }
  }
  .brandmark svg{ width:26px; height:26px; filter:drop-shadow(0 0 6px rgba(249,115,22,0.7)); }
  .navlinks{ display:flex; gap:7px; font-size:0.8rem; color:rgba(245,242,251,0.7); flex-wrap:wrap; }
  .navlinks a{
    position:relative; display:flex; align-items:center; height:36px; padding:0 12px; border-radius:9px;
    background:#0a0a0a; border:1.5px solid #F97316; color:#F97316; font-weight:700; letter-spacing:0.02em;
    font-size:0.78rem;
    box-shadow:0 0 8px rgba(249,115,22,0.6), 0 0 16px rgba(249,115,22,0.35), inset 0 0 6px rgba(249,115,22,0.15);
    transition:box-shadow .2s ease, color .2s ease, transform .15s ease, border-color .2s ease;
    white-space:nowrap;
  }
  .navlinks a:hover{
    color:#FB923C; border-color:#FB923C; transform:scale(1.04);
    box-shadow:0 0 12px rgba(251,146,60,0.9), 0 0 28px rgba(251,146,60,0.55), 0 0 44px rgba(251,146,60,0.25);
  }
  .navlinks a::after{ display:none; }
  .faq-nav-link{
    border-radius:10px !important; padding:0 14px !important;
    color:#F97316 !important; font-size:0.8rem !important; white-space:nowrap;
  }
  .faq-nav-link:hover{ background:#0a0a0a; }
  .nav-cta{
    display:flex; align-items:center; gap:8px; height:38px; padding:0 18px; border-radius:10px;
    background:#0a0a0a; border:1.5px solid #F97316; color:#F97316; font-size:0.85rem; font-weight:700; letter-spacing:0.03em;
    box-shadow:0 0 8px rgba(249,115,22,0.6), 0 0 16px rgba(249,115,22,0.35), inset 0 0 6px rgba(249,115,22,0.15);
    transition:box-shadow .2s ease, color .2s ease, transform .15s ease, border-color .2s ease;
  }
  .nav-cta:hover{
    color:#FB923C; border-color:#FB923C; transform:scale(1.04); background:#0a0a0a;
    box-shadow:0 0 12px rgba(251,146,60,0.9), 0 0 28px rgba(251,146,60,0.55), 0 0 44px rgba(251,146,60,0.25);
  }
  .nav-cta svg{ width:15px; height:15px; }
  .burger{ display:none; width:26px; height:18px; position:relative; cursor:pointer; }
  .burger span{ position:absolute; left:0; right:0; height:1px; background:#f5f2fb; transition:.3s; }
  .burger span:nth-child(1){ top:0; }
  .burger span:nth-child(2){ top:8px; }
  .burger span:nth-child(3){ top:16px; }
  .mobile-menu{
    position:fixed; inset:0; background:var(--hero-dark); z-index:99; color:#f5f2fb;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
    font-family:'Sora', sans-serif; font-size:1.4rem; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .35s ease;
  }
  .mobile-menu.open{ opacity:1; pointer-events:auto; }

  /* ================= HERO ================= */
  .hero{
    position:relative; width:100%; aspect-ratio:16/9;
    background:radial-gradient(ellipse at 50% 10%, #1a0f2e 0%, var(--hero-dark) 62%);
    overflow:hidden; color:#f5f2fb;
  }
  #emberCanvas{ position:absolute; inset:0; width:100%; height:100%; opacity:0.7; z-index:1; }
  .hero-video-layer{ position:absolute; inset:0; z-index:0; overflow:hidden; }
  .hero-video-layer video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:1; animation:fadeInVideo 1.5s ease forwards;
  }
  @keyframes fadeInVideo{ from{ opacity:0; } to{ opacity:1; } }
  .hero-video-layer::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(11,7,20,0.55) 0%, rgba(11,7,20,0.05) 40%, transparent 70%);
  }

  .cat-video{
    position:relative; width:100%; height:260px; overflow:hidden; margin-bottom:48px;
    border:1px solid var(--line);
  }
  .cat-video video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.55; }
  .cat-video::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, var(--hero-dark) 0%, rgba(11,7,20,0.1) 70%); }
  .cat-video .cat-video-label{
    position:absolute; left:24px; bottom:18px; z-index:2; font-family:'Sora',sans-serif; font-weight:700;
    font-size:1.3rem; color:#f5f2fb; text-shadow:0 0 20px var(--cat-accent, var(--neon));
  }
  @media(max-width:768px){ .cat-video{ height:180px; } }
  .hero-text-section{ background:var(--ink); padding:56px 0 60px; text-align:center; }

  /* ================= PER-CATEGORY DAZZLING GRADIENTS ================= */
  @keyframes dazzleShift{
    0%   { background-position:0% 50%; }
    25%  { background-position:100% 50%; }
    50%  { background-position:50% 0%; }
    75%  { background-position:50% 100%; }
    100% { background-position:0% 50%; }
  }
  .hero-text-section .wrap{ opacity:0; transform:translateY(16px); animation:riseIn .9s ease .15s forwards; }
  .kicker{
    font-size:0.78rem; letter-spacing:0.16em; color:var(--neon); display:flex; align-items:center;
    justify-content:center; gap:14px; margin-bottom:20px;
  }
  .kicker::before, .kicker::after{ content:''; width:34px; height:1px; background:var(--neon); }
  .hero-text-section h1{
    font-size:clamp(1.7rem, 4vw, 2.9rem); line-height:1.15; color:var(--ivory);
    max-width:680px; margin:0 auto;
  }
  .hero-text-section h1 em{
    font-style:normal; color:var(--neon);
  }
  .hero-text-section .lede{
    max-width:520px; margin:20px auto 0; font-size:0.98rem; line-height:1.7; color:var(--ivory-dim);
  }
  .hero-actions{
    display:flex; gap:18px; margin-top:32px; justify-content:center; flex-wrap:wrap;
  }

  .btn{ display:inline-flex; align-items:center; gap:10px; padding:15px 30px; font-size:0.88rem; letter-spacing:0.02em; cursor:pointer; border:1px solid transparent; position:relative; overflow:hidden; font-family:'Sora',sans-serif; font-weight:600; }
  .btn-solid{ background:linear-gradient(120deg, #FB923C, #F97316); color:#ffffff; box-shadow:0 0 30px rgba(249,115,22,0.45); }
  .btn-solid span{ position:relative; z-index:2; }
  .btn-solid::before{ content:''; position:absolute; inset:0; background:var(--neon-bright); transform:translateX(-101%); transition:transform .45s cubic-bezier(.65,0,.35,1); z-index:1; }
  .btn-solid:hover::before{ transform:translateX(0); }
  .btn-ghost{ border-color:var(--line); color:var(--ivory); transition:border-color .3s, color .3s; }
  .btn-ghost:hover{ border-color:var(--neon); color:var(--neon); }

  .hero-stats{
    display:flex; gap:56px; justify-content:center; margin-top:44px; flex-wrap:wrap;
  }
  .hero-stats .num{ font-family:'Sora',sans-serif; font-size:2.1rem; font-weight:700; color:var(--neon); }
  .hero-stats .lbl{ font-size:0.76rem; color:var(--ivory-dim); margin-top:4px; }

  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }
  .scroll-cue{ position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; font-size:0.7rem; letter-spacing:0.16em; color:rgba(245,242,251,0.78); z-index:2; }
  .scroll-cue .line{ width:1px; height:34px; background:linear-gradient(#F97316, transparent); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.3;} 50%{ opacity:1;} }

  /* ================= SECTIONS ================= */
  .section{ padding:110px 0; position:relative; }

  /* ================= OUR COLLECTIONS ================= */
  .collections-section{ background:var(--panel); padding:90px 0; text-align:center; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }

  /* ================= TALKING FAQ ================= */
  .faq-section{ text-align:center; scroll-margin-top:90px; }
  .faq-title{ font-size:clamp(1.8rem, 3.4vw, 2.6rem); color:var(--ivory); margin-top:14px; }
  .faq-subtitle{ color:var(--ivory-dim); font-size:0.95rem; margin-top:10px; margin-bottom:44px; }
  .faq-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px;
    max-width:1080px; margin:0 auto;
  }
  .faq-btn{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:150px; padding:20px 16px; overflow:hidden;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    cursor:pointer; font-family:inherit; width:100%;
    box-shadow:0 2px 10px rgba(194,65,12,0.05);
    transition:border-color .3s, box-shadow .3s, transform .3s;
  }
  .faq-btn:hover{ border-color:#C2410C; box-shadow:0 8px 24px rgba(194,65,12,0.15); transform:translateY(-3px); }

  .faq-icon{
    flex-shrink:0; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(194,65,12,0.09); color:#C2410C; font-size:1.15rem;
    transition:opacity .35s ease, transform .35s ease;
  }
  .faq-btn.playing .faq-icon{ background:#C2410C; color:#fff; animation:faqPulse 1s ease-in-out infinite; }

  .faq-question-ur{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:18px 16px; font-family:'Noto Nastaliq Urdu', serif; font-weight:700; font-size:1.15rem; line-height:2;
    color:#9A3412; direction:rtl; background:#fff;
    opacity:0; transform:translateY(8px); transition:opacity .35s ease, transform .35s ease; pointer-events:none;
  }
  @media (hover: hover){
    .faq-btn:hover .faq-icon{ opacity:0; transform:scale(0.7); }
    .faq-btn:hover .faq-question-ur{ opacity:1; transform:translateY(0); }
  }
  @media (hover: none){
    .faq-icon{ display:none; }
    .faq-question-ur{ position:static; opacity:1; transform:none; padding:6px 4px; }
  }

  .faq-status{
    position:absolute; bottom:10px; left:0; right:0; text-align:center;
    font-family:'Jost',sans-serif; font-size:0.68rem; color:var(--ivory-dim); letter-spacing:0.03em;
  }
  .faq-btn.unavailable{ cursor:not-allowed; opacity:0.6; }
  .faq-btn.unavailable .faq-question-ur{ color:#c2410c99; }
  .faq-btn.unavailable:hover{ transform:none; box-shadow:0 2px 10px rgba(194,65,12,0.05); border-color:var(--line); }
  @keyframes faqPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
  .collections-section .kicker{ justify-content:center; }
  .collections-section h2{ font-size:clamp(1.8rem, 3.4vw, 2.6rem); color:var(--ivory); margin-top:14px; margin-bottom:44px; }
  .collections-grid{
    display:grid; grid-template-columns:repeat(6, 1fr); gap:2px;
    max-width:1200px; margin:0 auto;
    background:linear-gradient(120deg, #7c2d12 0%, #F97316 25%, #FFD08A 50%, #F97316 75%, #7c2d12 100%);
    border-radius:8px; padding:2px; overflow:hidden;
    box-shadow:0 0 40px rgba(249,115,22,0.15);
  }
  .collection-card{
    position:relative; aspect-ratio:3/4; overflow:hidden;
    display:block; background:var(--panel);
  }
  .collection-card:first-child{ border-top-left-radius:6px; border-bottom-left-radius:6px; }
  .collection-card:last-child{ border-top-right-radius:6px; border-bottom-right-radius:6px; }
  .collection-card img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease; }
  .collection-card img.front{ opacity:1; transform:scale(1); filter:grayscale(1) contrast(1.05); }
  .collection-card img.back{ opacity:0; transform:scale(1.08); filter:grayscale(0); }
  @media (hover: hover){
    .collection-card:hover img.front{ opacity:0; transform:scale(0.94); }
    .collection-card:hover img.back{ opacity:1; transform:scale(1); }
  }
  .collection-card.flipped img.front{ opacity:0; transform:scale(0.94); }
  .collection-card.flipped img.back{ opacity:1; transform:scale(1); }
  .collection-card::after{
    content:''; position:absolute; inset:0; z-index:1;
    background:linear-gradient(to top, rgba(11,7,20,0.9) 0%, rgba(11,7,20,0.3) 45%, transparent 70%);
  }
  .collection-card .label{
    position:absolute; left:0; right:0; bottom:0; z-index:2; padding:16px 14px;
    text-align:left;
  }
  @media(max-width:980px){
    .collections-grid{ grid-template-columns:repeat(3, 1fr); }
  }
  @media(max-width:600px){
    .collections-grid{ grid-template-columns:repeat(2, 1fr); }
    .collection-card{ aspect-ratio:1/1; }
  }
  .collection-card .label h3{ font-size:1.15rem; color:#f5f2fb; font-weight:700; font-family:'Sora',sans-serif; }
  .collection-card .label span{
    font-size:0.78rem; display:block; margin-top:3px;
    background:var(--cat-gradient-bright, #FB923C); background-size:300% 300%;
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    animation:dazzleShift 9s ease-in-out infinite;
  }

  /* ================= SCROLL REVEAL ================= */
  .reveal{ opacity:0; transform:translateY(24px); transition:opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in-view{ opacity:1; transform:translateY(0); }

  .cat-section{ border-top:1px solid var(--line); scroll-margin-top:90px; overflow:hidden; }
  .cat-section:nth-child(odd){ background:var(--panel); }
  .cat-section::before{
    content:''; position:absolute; top:50%; left:50%; width:130%; height:130%;
    transform:translate(-50%,-50%) scale(1); z-index:0; pointer-events:none;
    background:radial-gradient(circle, var(--cat-accent, var(--neon)) 0%, transparent 62%);
    opacity:0.05; animation:catPulse 7s ease-in-out infinite;
  }
  .cat-section > .wrap{ position:relative; z-index:1; }
  @keyframes catPulse{
    0%, 100%{ opacity:0.04; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:0.11; transform:translate(-50%,-50%) scale(1.1); }
  }
  .cat-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:56px; flex-wrap:wrap; }
  .cat-head .kicker{
    justify-content:flex-start; margin-bottom:14px;
    background:var(--cat-gradient, var(--neon)); background-size:300% 300%;
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    animation:dazzleShift 9s ease-in-out infinite;
  }
  .cat-head .kicker::before{ background:var(--cat-gradient, var(--cat-accent, var(--neon))); background-size:300% 300%; animation:dazzleShift 9s ease-in-out infinite; }
  .cat-head .kicker::after{ display:none; }
  .cat-head h2{
    font-size:clamp(1.9rem, 3.4vw, 2.6rem);
    background:var(--cat-gradient, var(--ivory)); background-size:300% 300%;
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    animation:dazzleShift 9s ease-in-out infinite;
  }
  .cat-head p{ color:var(--ivory-dim); max-width:380px; font-size:0.95rem; line-height:1.6; }

  .product-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 260px)); gap:18px; justify-content:center; }

  .flip-card{ position:relative; }
  .flip-card-inner{
    position:relative; width:100%; aspect-ratio:3/4;
  }
  .flip-front, .flip-back{
    position:absolute; inset:0;
    border:1px solid var(--cat-accent, var(--line)); overflow:hidden; background:var(--panel);
    transition:opacity 0.5s ease, transform 0.5s ease;
    display:flex; flex-direction:column;
  }
  .flip-front::before{
    content:''; position:absolute; top:0; left:0; right:0; height:4px; z-index:3;

  .flip-back{ opacity:0; transform:scale(1.05); z-index:1; pointer-events:none; }
  .flip-card.flipped .flip-front{ opacity:0; transform:scale(0.95); z-index:1; pointer-events:none; }

  @media (hover: hover){

    .flip-card:hover .flip-back{ opacity:1; transform:scale(1); z-index:2; pointer-events:auto; }
  }
