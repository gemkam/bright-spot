<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bright Spot — Multan's Online Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ffffff;
    --panel:#f6f4fb;
    --panel-2:#ece8f9;
    --line: rgba(109,40,217,0.18);
    --ivory:#1a1625;
    --ivory-dim:#6b6478;
    --neon:#F97316;
    --neon-bright:#FB923C;
    --cat-home:#2E7D32;
    --cat-beauty:#B45309;
    --cat-electronics:#1D4ED8;
    --cat-fashion:#C2410C;
    --hero-dark:#0b0714;
    --radius: 3px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--ink); color:var(--ivory); font-family:'Jost', sans-serif; font-weight:300; overflow-x:hidden; }
  h1,h2,h3,.display{ font-family:'Sora', sans-serif; font-weight:700; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  img,svg{ display:block; max-width:100%; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
  ::selection{ background:var(--neon); color:var(--ink); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; animation-iteration-count:1 !important; transition-duration:0.1s !important; }
  }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:1px solid var(--neon-bright); outline-offset:3px;
  }

  /* ================= NAV ================= */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:linear-gradient(to bottom, rgba(11,7,20,0.92), rgba(11,7,20,0));
    padding:20px 0; transition:background .4s ease, padding .4s ease;
  }
  header.scrolled{ background:rgba(11,7,20,0.92); backdrop-filter:blur(8px); padding:13px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; }
  .brandmark{ display:flex; align-items:center; gap:10px; font-family:'Sora', sans-serif; font-weight:700; font-size:1.3rem; letter-spacing:-0.01em; color:var(--ivory); }
  header .brandmark{ color:#f5f2fb; }

  .brandmark-sparkle{ position:relative; }
  .shine-text{
    position:relative; display:inline-block;
    color:#ffffff;
    animation:glowPulse 2.6s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%, 100%{ text-shadow:0 0 6px rgba(255,214,0,0.35), 0 0 1px rgba(255,255,255,0.6); }
    50%{ text-shadow:0 0 16px rgba(255,214,0,0.85), 0 0 30px rgba(249,115,22,0.5), 0 0 2px rgba(255,255,255,0.9); }
  }
  .sparkle{
    position:absolute; width:10px; height:10px; pointer-events:none;
    animation:sparkleTwinkle 2.4s ease-in-out infinite;
  }
  .sparkle-1{ top:-6px; right:-4px; animation-delay:0s; }
  .sparkle-2{ bottom:-4px; right:22%; width:7px; height:7px; animation-delay:1.1s; }
  @keyframes sparkleTwinkle{
    0%, 100%{ opacity:0; transform:scale(0.3) rotate(0deg); }
    50%{ opacity:1; transform:scale(1) rotate(25deg); }
  }
  .brandmark svg{ width:26px; height:26px; filter:drop-shadow(0 0 6px rgba(249,115,22,0.7)); }
  .navlinks{ display:flex; gap:22px; font-size:0.85rem; color:rgba(245,242,251,0.7); }
  .navlinks a{ position:relative; padding-bottom:4px; transition:color .3s; }
  .navlinks a:hover{ color:var(--neon-bright); }
  .navlinks a::after{ content:''; position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--neon-bright); transition:width .35s ease; }
  .navlinks a:hover::after{ width:100%; }
  .nav-cta{
    display:flex; align-items:center; gap:8px; border:1px solid var(--neon-bright); padding:9px 18px;
    font-size:0.85rem; color:var(--neon-bright); transition:background .3s, color .3s;
    box-shadow:0 0 18px rgba(249,115,22,0.3);
  }
  .nav-cta:hover{ background:var(--neon-bright); color:#0b0714; }
  .nav-cta svg{ width:15px; height:15px; }
  .burger{ display:none; width:26px; height:18px; position:relative; cursor:pointer; }
  .burger span{ position:absolute; left:0; right:0; height:1px; background:#f5f2fb; transition:.3s; }
  .burger span:nth-child(1){ top:0; }
  .burger span:nth-child(2){ top:8px; }
  .burger span:nth-child(3){ top:16px; }
  .mobile-menu{
    position:fixed; inset:0; background:var(--hero-dark); z-index:99; color:#f5f2fb;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
    font-family:'Sora', sans-serif; font-size:1.4rem; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .35s ease;
  }
  .mobile-menu.open{ opacity:1; pointer-events:auto; }

  /* ================= HERO ================= */
  .hero{
    position:relative; width:100%; aspect-ratio:16/9;
    background:radial-gradient(ellipse at 50% 10%, #1a0f2e 0%, var(--hero-dark) 62%);
    overflow:hidden; color:#f5f2fb;
  }
  #emberCanvas{ position:absolute; inset:0; width:100%; height:100%; opacity:0.7; z-index:1; }
  .hero-video-layer{ position:absolute; inset:0; z-index:0; overflow:hidden; }
  .hero-video-layer video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:1; animation:fadeInVideo 1.5s ease forwards;
  }
  @keyframes fadeInVideo{ from{ opacity:0; } to{ opacity:1; } }
  .hero-video-layer::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(11,7,20,0.55) 0%, rgba(11,7,20,0.05) 40%, transparent 70%);
  }

  .cat-video{
    position:relative; width:100%; height:260px; overflow:hidden; margin-bottom:48px;
    border:1px solid var(--line);
  }
  .cat-video video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.55; }
  .cat-video::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, var(--hero-dark) 0%, rgba(11,7,20,0.1) 70%); }
  .cat-video .cat-video-label{
    position:absolute; left:24px; bottom:18px; z-index:2; font-family:'Sora',sans-serif; font-weight:700;
    font-size:1.3rem; color:#f5f2fb; text-shadow:0 0 20px var(--cat-accent, var(--neon));
  }
  @media(max-width:768px){ .cat-video{ height:180px; } }
  .hero-text-section{ background:var(--ink); padding:56px 0 60px; text-align:center; }
  .hero-text-section .wrap{ opacity:0; transform:translateY(16px); animation:riseIn .9s ease .15s forwards; }
  .kicker{
    font-size:0.78rem; letter-spacing:0.16em; color:var(--neon); display:flex; align-items:center;
    justify-content:center; gap:14px; margin-bottom:20px;
  }
  .kicker::before, .kicker::after{ content:''; width:34px; height:1px; background:var(--neon); }
  .hero-text-section h1{
    font-size:clamp(1.7rem, 4vw, 2.9rem); line-height:1.15; color:var(--ivory);
    max-width:680px; margin:0 auto;
  }
  .hero-text-section h1 em{
    font-style:normal; color:var(--neon);
  }
  .hero-text-section .lede{
    max-width:520px; margin:20px auto 0; font-size:0.98rem; line-height:1.7; color:var(--ivory-dim);
  }
  .hero-actions{
    display:flex; gap:18px; margin-top:32px; justify-content:center; flex-wrap:wrap;
  }

  .btn{ display:inline-flex; align-items:center; gap:10px; padding:15px 30px; font-size:0.88rem; letter-spacing:0.02em; cursor:pointer; border:1px solid transparent; position:relative; overflow:hidden; font-family:'Sora',sans-serif; font-weight:600; }
  .btn-solid{ background:linear-gradient(120deg, #FB923C, #F97316); color:#ffffff; box-shadow:0 0 30px rgba(249,115,22,0.45); }
  .btn-solid span{ position:relative; z-index:2; }
  .btn-solid::before{ content:''; position:absolute; inset:0; background:var(--neon-bright); transform:translateX(-101%); transition:transform .45s cubic-bezier(.65,0,.35,1); z-index:1; }
  .btn-solid:hover::before{ transform:translateX(0); }
  .btn-ghost{ border-color:var(--line); color:var(--ivory); transition:border-color .3s, color .3s; }
  .btn-ghost:hover{ border-color:var(--neon); color:var(--neon); }

  .hero-stats{
    display:flex; gap:56px; justify-content:center; margin-top:44px; flex-wrap:wrap;
  }
  .hero-stats .num{ font-family:'Sora',sans-serif; font-size:2.1rem; font-weight:700; color:var(--neon); }
  .hero-stats .lbl{ font-size:0.76rem; color:var(--ivory-dim); margin-top:4px; }

  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }
  .scroll-cue{ position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; font-size:0.7rem; letter-spacing:0.16em; color:rgba(245,242,251,0.78); z-index:2; }
  .scroll-cue .line{ width:1px; height:34px; background:linear-gradient(#F97316, transparent); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.3;} 50%{ opacity:1;} }

  /* ================= SECTIONS ================= */
  .section{ padding:110px 0; position:relative; }

  /* ================= OUR COLLECTIONS ================= */
  .collections-section{ background:var(--panel); padding:90px 0; text-align:center; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .collections-section .kicker{ justify-content:center; }
  .collections-section h2{ font-size:clamp(1.8rem, 3.4vw, 2.6rem); color:var(--ivory); margin-top:14px; margin-bottom:44px; }
  .collections-grid{
    display:grid; grid-template-columns:repeat(6, 1fr); gap:2px;
    max-width:1200px; margin:0 auto;
    background:linear-gradient(120deg, #7c2d12 0%, #F97316 25%, #FFD08A 50%, #F97316 75%, #7c2d12 100%);
    border-radius:8px; padding:2px; overflow:hidden;
    box-shadow:0 0 40px rgba(249,115,22,0.15);
  }
  .collection-card{
    position:relative; aspect-ratio:3/4; overflow:hidden;
    display:block; background:var(--panel);
  }
  .collection-card:first-child{ border-top-left-radius:6px; border-bottom-left-radius:6px; }
  .collection-card:last-child{ border-top-right-radius:6px; border-bottom-right-radius:6px; }
  .collection-card img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease; }
  .collection-card img.front{ opacity:1; transform:scale(1); filter:grayscale(1) contrast(1.05); }
  .collection-card img.back{ opacity:0; transform:scale(1.08); filter:grayscale(0); }
  @media (hover: hover){
    .collection-card:hover img.front{ opacity:0; transform:scale(0.94); }
    .collection-card:hover img.back{ opacity:1; transform:scale(1); }
  }
  .collection-card.flipped img.front{ opacity:0; transform:scale(0.94); }
  .collection-card.flipped img.back{ opacity:1; transform:scale(1); }
  .collection-card::after{
    content:''; position:absolute; inset:0; z-index:1;
    background:linear-gradient(to top, rgba(11,7,20,0.9) 0%, rgba(11,7,20,0.3) 45%, transparent 70%);
  }
  .collection-card .label{
    position:absolute; left:0; right:0; bottom:0; z-index:2; padding:16px 14px;
    text-align:left;
  }
  @media(max-width:980px){
    .collections-grid{ grid-template-columns:repeat(3, 1fr); }
  }
  @media(max-width:600px){
    .collections-grid{ grid-template-columns:repeat(2, 1fr); }
    .collection-card{ aspect-ratio:1/1; }
  }
  .collection-card .label h3{ font-size:1.15rem; color:#f5f2fb; font-weight:700; font-family:'Sora',sans-serif; }
  .collection-card .label span{ font-size:0.78rem; color:var(--cat-accent, #FB923C); display:block; margin-top:3px; }

  /* ================= SCROLL REVEAL ================= */
  .reveal{ opacity:0; transform:translateY(24px); transition:opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in-view{ opacity:1; transform:translateY(0); }

  .cat-section{ border-top:1px solid var(--line); scroll-margin-top:90px; }
  .cat-section:nth-child(odd){ background:var(--panel); }
  .cat-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:56px; flex-wrap:wrap; }
  .cat-head .kicker{ justify-content:flex-start; margin-bottom:14px; color:var(--cat-accent, var(--neon)); }
  .cat-head .kicker::before{ background:var(--cat-accent, var(--neon)); }
  .cat-head .kicker::after{ display:none; }
  .cat-head h2{ font-size:clamp(1.9rem, 3.4vw, 2.6rem); color:var(--ivory); }
  .cat-head p{ color:var(--ivory-dim); max-width:380px; font-size:0.95rem; line-height:1.6; }

  .product-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 260px)); gap:18px; justify-content:center; }

  .flip-card{ position:relative; }
  .flip-card-inner{
    position:relative; width:100%; aspect-ratio:3/4;
  }
  .flip-front, .flip-back{
    position:absolute; inset:0;
    border:1px solid var(--cat-accent, var(--line)); overflow:hidden; background:var(--panel);
    transition:opacity 0.5s ease, transform 0.5s ease;
    display:flex; flex-direction:column;
  }
  .flip-front{ opacity:1; transform:scale(1); z-index:2; pointer-events:auto; }
  .flip-back{ opacity:0; transform:scale(1.05); z-index:1; pointer-events:none; }
  .flip-card.flipped .flip-front{ opacity:0; transform:scale(0.95); z-index:1; pointer-events:none; }
  .flip-card.flipped .flip-back{ opacity:1; transform:scale(1); z-index:2; pointer-events:auto; }
  @media (hover: hover){
    .flip-card:hover .flip-front{ opacity:0; transform:scale(0.95); z-index:1; pointer-events:none; }
    .flip-card:hover .flip-back{ opacity:1; transform:scale(1); z-index:2; pointer-events:auto; }
  }

  .flip-front img, .flip-back img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .flip-front::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(11,7,20,0.92) 0%, rgba(11,7,20,0.25) 45%, transparent 70%);
  }
  .flip-front .flip-label{
    position:absolute; left:16px; right:16px; bottom:14px; z-index:2;
  }
  .flip-front .flip-label h3{ font-size:1.02rem; color:#f5f2fb; font-weight:600; }
  .flip-front .flip-label .note{ font-size:0.76rem; color:var(--cat-accent, var(--neon-bright)); margin-top:3px; }
  .flip-hint{
    position:absolute; top:12px; right:12px; z-index:2; width:26px; height:26px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.4); display:flex; align-items:center; justify-content:center;
    color:#f5f2fb; font-size:0.7rem; background:rgba(11,7,20,0.45);
  }
  .flip-back{ display:flex; flex-direction:column; justify-content:flex-end; }
  .flip-back::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(11,7,20,0.95) 0%, rgba(11,7,20,0.55) 32%, transparent 60%);
  }
  .flip-back-content{
    position:relative; z-index:2; padding:14px 16px 16px; display:flex; flex-direction:column;
  }
  .flip-back-content h3{ font-size:0.94rem; color:#f5f2fb; font-weight:600; line-height:1.3; }
  .flip-back-content .note{ font-size:0.72rem; color:var(--cat-accent, var(--neon-bright)); margin-top:2px; }
  .flip-back-content p{ font-size:0.8rem; color:rgba(245,242,251,0.85); line-height:1.5; margin-top:8px; flex:1; }
  .flip-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.15); gap:8px; }
  .flip-back .price{ color:#f5f2fb; }
  .flip-back .price span{ color:rgba(245,242,251,0.65); }
  .flip-back .icon-btn{ border-color:rgba(255,255,255,0.35); color:rgba(245,242,251,0.85); }
  .price{ font-family:'Sora', sans-serif; font-size:1.05rem; font-weight:700; color:var(--ivory); }
  .price span{ font-size:0.66rem; color:var(--ivory-dim); font-weight:400; }
  .flip-actions{ display:flex; align-items:center; gap:6px; }
  .icon-btn{
    display:flex; align-items:center; justify-content:center; width:32px; height:32px;
    border:1px solid var(--line); color:var(--ivory-dim); transition:border-color .3s, background .3s, color .3s; cursor:pointer; background:none;
  }
  .icon-btn:hover{ border-color:var(--cat-accent, var(--neon)); color:var(--cat-accent, var(--neon)); background:color-mix(in srgb, var(--cat-accent, var(--neon)) 12%, transparent); }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn.cart-btn.added{ border-color:var(--cat-accent, var(--neon)); color:var(--cat-accent, var(--neon)); }

  /* ================= CART ================= */
  .admin-link{
    display:flex; align-items:center; height:38px; padding:0 14px;
    border:1px solid rgba(245,242,251,0.25); color:#f5f2fb; font-size:0.82rem; font-weight:500;
    transition:border-color .3s, color .3s;
  }
  .admin-link:hover{ border-color:var(--neon); color:var(--neon-bright); }
  .cart-toggle{
    position:relative; display:flex; align-items:center; justify-content:center; width:38px; height:38px;
    border:1px solid rgba(245,242,251,0.25); color:#f5f2fb; cursor:pointer; background:none; transition:border-color .3s;
  }
  .cart-toggle:hover{ border-color:var(--neon); }
  .cart-toggle svg{ width:17px; height:17px; }
  .cart-badge{
    position:absolute; top:-7px; right:-7px; min-width:18px; height:18px; padding:0 4px; border-radius:9px;
    background:var(--neon); color:#ffffff; font-size:0.65rem; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .cart-overlay{
    position:fixed; inset:0; background:rgba(11,7,20,0.6); backdrop-filter:blur(3px); z-index:200;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .cart-overlay.open{ opacity:1; pointer-events:auto; }
  .cart-drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(400px, 92vw); background:var(--panel); z-index:201;
    border-left:1px solid var(--line); display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .4s cubic-bezier(.4,.2,.2,1);
  }
  .cart-overlay.open .cart-drawer{ transform:translateX(0); }
  .cart-header{ display:flex; align-items:center; justify-content:space-between; padding:20px; border-bottom:1px solid var(--line); }
  .cart-header h3{ font-family:'Sora',sans-serif; font-size:1.1rem; color:var(--ivory); }
  .cart-close{ background:none; border:none; color:var(--ivory-dim); font-size:1.4rem; cursor:pointer; line-height:1; }
  .cart-items{ flex:1; overflow-y:auto; padding:12px 20px; }
  .cart-empty{ color:var(--ivory-dim); font-size:0.9rem; text-align:center; padding:40px 0; }
  .cart-item{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .cart-item-img{ width:44px; height:44px; flex-shrink:0; border-radius:6px; object-fit:cover; }
  .cart-item-info{ flex:1; min-width:0; }
  .cart-item-info h4{ font-size:0.88rem; color:var(--ivory); font-weight:600; }
  .cart-item-price{ font-size:0.82rem; color:var(--ivory-dim); margin-top:2px; }
  .cart-qty{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .cart-qty button{ width:22px; height:22px; border:1px solid var(--line); background:none; color:var(--ivory); cursor:pointer; font-size:0.8rem; }
  .cart-qty span{ font-size:0.85rem; color:var(--ivory); min-width:16px; text-align:center; }
  .cart-remove{ background:none; border:none; color:var(--ivory-dim); font-size:0.72rem; text-decoration:underline; cursor:pointer; margin-left:auto; }
  .cart-footer{ padding:18px 20px; border-top:1px solid var(--line); }
  .cart-subtotal{ display:flex; justify-content:space-between; font-family:'Sora',sans-serif; font-size:1rem; color:var(--ivory); margin-bottom:14px; }
  .cart-checkout{ width:100%; justify-content:center; }

  .checkout-view{ padding:16px 20px; overflow-y:auto; flex:1; }
  .checkout-view h4{ font-family:'Sora',sans-serif; font-size:0.95rem; color:var(--ivory); margin-bottom:4px; }
  .checkout-view .cod-tag{
    display:inline-flex; align-items:center; gap:6px; font-size:0.72rem; color:var(--neon-bright);
    border:1px solid var(--line); padding:5px 10px; margin-bottom:16px;
  }
  .checkout-field{ margin-bottom:14px; }
  .checkout-field label{ display:block; font-size:0.76rem; color:var(--ivory-dim); margin-bottom:6px; }
  .checkout-field input, .checkout-field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ivory);
    padding:10px 12px; font-family:'Jost',sans-serif; font-size:0.9rem;
  }
  .checkout-field input:focus, .checkout-field textarea:focus{ outline:none; border-color:var(--neon); }
  .checkout-field textarea{ resize:vertical; min-height:60px; }
  .checkout-summary{ font-size:0.82rem; color:var(--ivory-dim); border-top:1px solid var(--line); padding-top:12px; margin-top:4px; margin-bottom:14px; }
  .checkout-summary div{ display:flex; justify-content:space-between; margin-bottom:4px; }
  .checkout-summary .total{ color:var(--ivory); font-weight:600; margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
  .checkout-back{ background:none; border:none; color:var(--ivory-dim); font-size:0.78rem; text-decoration:underline; cursor:pointer; margin-bottom:14px; }
  .checkout-error{ color:#ff6b6b; font-size:0.78rem; margin-bottom:10px; display:none; }

  .order-success{ padding:40px 24px; text-align:center; }
  .order-success .check{ width:52px; height:52px; margin:0 auto 18px; border-radius:50%; border:1px solid var(--neon); display:flex; align-items:center; justify-content:center; color:var(--neon); font-size:1.4rem; }
  .order-success h3{ font-family:'Sora',sans-serif; color:var(--ivory); margin-bottom:8px; }
  .order-success p{ font-size:0.88rem; color:var(--ivory-dim); line-height:1.6; margin-bottom:6px; }
  .order-success .order-id{ color:var(--neon-bright); font-weight:600; }

  .wa-btn{ display:flex; align-items:center; gap:6px; font-size:0.74rem; color:var(--neon-bright); border:1px solid var(--line); padding:8px 12px; transition:border-color .3s, background .3s; }
  .wa-btn:hover{ border-color:var(--cat-accent, var(--neon)); background:color-mix(in srgb, var(--cat-accent, var(--neon)) 12%, transparent); }
  .wa-btn svg{ width:13px; height:13px; }

  /* ================= CONTACT ================= */
  .contact{ background:var(--panel); border-top:1px solid var(--line); scroll-margin-top:90px; }
  .contact-grid{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:70px; }
  .contact-info .item{ margin-bottom:28px; }
  .contact-info .label{ font-size:0.74rem; color:var(--neon); letter-spacing:0.08em; margin-bottom:6px; }
  .contact-info .val{ font-size:1.02rem; color:var(--ivory); }
  .contact-info a.val:hover{ color:var(--neon-bright); }
  form{ display:flex; flex-direction:column; gap:22px; }
  .field{ position:relative; }
  .field label{ position:absolute; left:0; top:14px; font-size:0.95rem; color:var(--ivory-dim); transition:.25s ease; pointer-events:none; }
  .field input, .field textarea{ width:100%; background:transparent; border:none; border-bottom:1px solid var(--line); padding:14px 0; font-family:'Jost',sans-serif; font-size:0.98rem; color:var(--ivory); }
  .field textarea{ resize:vertical; min-height:80px; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--neon); }
  .field input:focus ~ label, .field input:not(:placeholder-shown) ~ label,
  .field textarea:focus ~ label, .field textarea:not(:placeholder-shown) ~ label{ top:-14px; font-size:0.72rem; color:var(--neon); }
  .field input::placeholder, .field textarea::placeholder{ color:transparent; }
  .submit-row{ display:flex; align-items:center; gap:20px; margin-top:6px; flex-wrap:wrap; }
  .form-note{ font-size:0.8rem; color:var(--ivory-dim); }

  footer{ padding:44px 0; border-top: 1px solid var(--line); text-align: center; color: var(--ivory-dim); font-size: 0.85rem; }
</style>
</head>
<body>

  <!-- Main Application Root Elements -->
  <div id="collectionsRoot"></div>
  <div id="categoriesRoot"></div>

  <footer>
    <div class="wrap">
      <p>&copy; 2026 Bright Spot — All rights reserved.</p>
    </div>
  </footer>

  <!-- Supabase CDN Script (Required for client instantiation) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Integrated Live Catalog JS Script -->
  <script>
    // ================= LIVE CATALOG FROM SUPABASE =================
    const SUPABASE_URL = "https://kcggcbenponibkzhstwi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjZ2djYmVucG9uaWJremhzdHdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDI3MzEsImV4cCI6MjEwMzgxODczMX0.H0VBRcwwOZlzhNAlWYqCmC3qkycn1mP9fmj_kXtQ8MY";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Static per-category styling/video that isn't stored in the DB
    const CATEGORY_META = {
      "fashion":         { accent:"#C2410C", tagline:"Bags, jewelry, and everyday accessories.", video:"https://videos.pexels.com/video-files/8306450/8306450-uhd_2732_1440_25fps.mp4" },
      "electronics":     { accent:"#1D4ED8", tagline:"Everyday tech, tested and ready to ship same day.", video:"https://videos.pexels.com/video-files/5726124/5726124-uhd_2560_1440_30fps.mp4" },
      "beauty":          { accent:"#B45309", tagline:"Skincare, makeup, and haircare picks that actually get used.", video:"https://videos.pexels.com/video-files/7754395/7754395-hd_1080_1920_30fps.mp4" },
      "home-kitchen":    { accent:"#2E7D32", tagline:"Everyday essentials for the Multan kitchen and living room.", video:"https://videos.pexels.com/video-files/4253333/4253333-uhd_1440_2732_25fps.mp4" },
      "kids-baby":       { accent:"#DB2777", tagline:"Safe, simple picks for little ones.", video:"https://videos.pexels.com/video-files/8306450/8306450-uhd_2732_1440_25fps.mp4" },
      "health-wellness": { accent:"#0891B2", tagline:"Everyday relief and recovery essentials.", video:"https://videos.pexels.com/video-files/7754395/7754395-hd_1080_1920_30fps.mp4" },
    };

    const collectionsRoot = document.getElementById('collectionsRoot');
    const categoriesRoot = document.getElementById('categoriesRoot');

    // Make sure PRODUCTS object exists if cart scripts expect it elsewhere
    window.PRODUCTS = window.PRODUCTS || {};

    function renderStorefront(categories){
      // ---------- Our Collections ----------
      collectionsRoot.innerHTML = categories.map(cat => {
        const cover = cat.products[0];
        const img1 = cover?.img1 || '';
        const img2 = cover?.img2 || img1;
        return `
          <a href="#${cat.id}" class="collection-card" style="--cat-accent:${cat.accent}">
            <img class="front" src="${img1}" alt="${cat.label}" loading="lazy">
            <img class="back" src="${img2}" alt="" loading="lazy">
            <div class="label">
              <h3>${cat.label}</h3>
              <span>${cat.products.length} products</span>
            </div>
          </a>`;
      }).join('');

      document.querySelectorAll('.collection-card').forEach(card=>{
        card.addEventListener('click', (e)=>{
          if (window.matchMedia('(hover: none)').matches && !card.classList.contains('flipped')){
            e.preventDefault();
            card.classList.add('flipped');
          }
        });
      });

      // ---------- Category sections + product grid ----------
      categoriesRoot.innerHTML = '';
      categories.forEach(cat=>{
        const section = document.createElement('section');
        section.className = 'section cat-section';
        section.id = cat.id;
        section.style.setProperty('--cat-accent', cat.accent);
        const grid = cat.products.map((p, idx)=>{
          const productId = `${cat.id}-${idx}`;
          PRODUCTS[productId] = { name:p.name, note:p.note, price:p.price, img:p.img1 };
          const shareText = encodeURIComponent(`${p.name} (${p.note}) — Rs ${p.price}\n${p.desc}\nFrom Bright Spot`);
          return `
            <div class="flip-card">
              <div class="flip-card-inner">
                <div class="flip-front">
                  <img src="${p.img1}" alt="${p.name}" loading="lazy">
                  <div class="flip-hint">↻</div>
                  <div class="flip-label">
                    <h3>${p.name}</h3>
                    <div class="note">${p.note}</div>
                  </div>
                </div>
                <div class="flip-back">
                  <img src="${p.img2}" alt="${p.name} detail" loading="lazy">
                  <div class="flip-back-content">
                    <h3>${p.name}</h3>
                    <div class="note">${p.note}</div>
                    <p>${p.desc}</p>
                    <div class="flip-foot">
                      <div class="price">${p.price}<span> PKR</span></div>
                      <div class="flip-actions">
                        <a class="icon-btn" href="https://wa.me/?text=${shareText}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="Share on WhatsApp" title="Share on WhatsApp">
                          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
                        </a>
                        <button class="icon-btn cart-btn" data-product-id="${productId}" onclick="event.stopPropagation(); if(typeof addToCart === 'function') addToCart('${productId}', this);" aria-label="Add to cart" title="Add to cart">
                          <svg viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h8a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.4" fill="currentColor"/><circle cx="18" cy="21" r="1.4" fill="currentColor"/></svg>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>`;
        }).join('');
        section.innerHTML = `
          <div class="wrap">
            <div class="cat-video" data-video="${cat.video}">
              <video muted loop playsinline preload="none"></video>
              <div class="cat-video-label">${cat.label}</div>
            </div>
            <div class="cat-head">
              <div>
                <div class="kicker">${cat.label.toUpperCase()}</div>
                <h2>${cat.label}</h2>
              </div>
              <p>${cat.tagline}</p>
            </div>
            <div class="product-grid">${grid}</div>
          </div>`;
        categoriesRoot.appendChild(section);
      });

      document.querySelectorAll('.flip-card').forEach(card=>{
        card.addEventListener('click', (e)=>{
          if (window.matchMedia('(hover: none)').matches){
            card.classList.toggle('flipped');
          }
        });
      });

      document.querySelectorAll('.cat-head, .flip-card, .contact-grid > *').forEach(el=>{
        el.classList.add('reveal');
      });
      const revealObserver2 = new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          if (entry.isIntersecting){
            entry.target.classList.add('in-view');
            revealObserver2.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.reveal').forEach(el => revealObserver2.observe(el));

      // re-wire lazy category videos for the freshly-inserted sections
      const catVideoObserver2 = new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            const container = entry.target;
            const video = container.querySelector('video');
            if(!video.src){
              video.src = container.dataset.video;
              video.play().catch(()=>{});
            }
            catVideoObserver2.unobserve(container);
          }
        });
      }, {threshold:0.15});
      document.querySelectorAll('.cat-video').forEach(el=>catVideoObserver2.observe(el));

      // cart may have been initialized before products loaded — re-render now that PRODUCTS is populated
      if (typeof renderCart === 'function') renderCart();
    }

    async function loadCatalog(){
      const [{ data: cats, error: catErr }, { data: prods, error: prodErr }] = await Promise.all([
        sb.from('categories').select('*').order('sort_order'),
        sb.from('products').select('*').eq('is_active', true).order('created_at'),
      ]);

      if (catErr || prodErr){
        console.error('Catalog load failed', catErr, prodErr);
        categoriesRoot.innerHTML = `<div class="wrap" style="padding:60px 0; text-align:center; color:var(--ivory-dim);">We will update you soon.</div>`;
        return;
      }

      const categories = (cats || []).map(c => {
        const meta = CATEGORY_META[c.id] || {};
        return {
          id: c.id,
          label: c.label,
          accent: meta.accent || '#F97316',
          tagline: meta.tagline || '',
          video: meta.video || '',
          products: (prods || [])
            .filter(p => p.category_id === c.id)
            .map(p => ({
              name: p.name,
              note: p.note || '',
              desc: p.description || '',
              price: Math.round(Number(p.price_pkr)).toLocaleString(),
              img1: p.image_front || '',
              img2: p.image_back || p.image_front || '',
            })),
        };
      }).filter(c => c.products.length > 0); // skip categories with nothing active to show

      renderStorefront(categories);
    }

    loadCatalog();
  </script>
</body>
</html>
